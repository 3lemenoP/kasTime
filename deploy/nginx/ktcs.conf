# =============================================================================
# KTCS nginx Reverse Proxy Configuration (bare-metal deployment)
# =============================================================================
# Install: sudo cp ktcs.conf /etc/nginx/sites-available/ktcs
#          sudo ln -s /etc/nginx/sites-available/ktcs /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Use certbot to obtain certificates:
#   sudo certbot --nginx -d your-domain.com

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=ktcs_api:10m rate=10r/s;

upstream ktcs_calendar {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # TLS certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://kaspa.aspectron.com wss://resolver.kaspa.stream; img-src 'self' data:;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 256;

    # WASM content type
    types {
        application/wasm wasm;
    }

    # Frontend static files
    root /opt/ktcs/frontend;
    index index.html;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /wasm/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API proxy with rate limiting
    location /v1/ {
        limit_req zone=ktcs_api burst=50 nodelay;

        proxy_pass http://ktcs_calendar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for /v1/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Health check proxy (no rate limit)
    location /health {
        proxy_pass http://ktcs_calendar;
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
