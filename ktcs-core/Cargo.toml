[package]
name = "ktcs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Kaspa Thermodynamic Clock Service - proof format, Merkle trees, verification"

[dependencies]
# Cryptography
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
hex.workspace = true
secp256k1.workspace = true
zeroize.workspace = true
blake2 = "0.10"
blake2b_simd = "1.0"

# CSPRNG (optional for non-WASM)
getrandom = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Async (optional, for Kaspa client)
tokio = { workspace = true, optional = true, features = ["sync", "time"] }

# WebSocket (optional, for Kaspa client)
tokio-tungstenite = { version = "0.21", optional = true, features = ["native-tls"] }
futures-util = { version = "0.3", optional = true }
url = { version = "2.5", optional = true }

# HTTP client (optional, for resolver)
reqwest = { version = "0.11", optional = true, default-features = false, features = ["json", "native-tls-vendored"] }

# Logging (optional, for Kaspa client)
tracing = { workspace = true, optional = true }

[features]
default = ["keygen"]
kaspa-client = ["tokio", "tokio-tungstenite", "futures-util", "url", "tracing", "reqwest"]
wasm = []
keygen = ["getrandom", "rand"]

[dev-dependencies]
tokio = { workspace = true }
