[package]
name = "ktcs-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for Kaspa Thermodynamic Clock Service"

[[bin]]
name = "ktcs"
path = "src/main.rs"

[dependencies]
ktcs-core = { path = "../ktcs-core", features = ["kaspa-client"] }
clap.workspace = true
tokio.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# For HTTP requests to calendar
reqwest = { version = "0.11", features = ["json"] }

# For base64 decoding
base64 = "0.21"

# For colored output
colored = "2.0"

# For config file parsing
toml = "0.8"

# For finding config directory
dirs = "5.0"

# For shell completions
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"
wiremock = "0.6"
tokio-test = "0.4"
