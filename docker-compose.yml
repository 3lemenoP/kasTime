# =============================================================================
# KTCS Full Stack - Docker Compose
# =============================================================================
# Usage:
#   cp .env.production.template .env.production
#   # Edit .env.production with your values
#   docker compose up -d
#
# Logs:   docker compose logs -f
# Stop:   docker compose down
# Rebuild: docker compose up -d --build

services:
  # ---------------------------------------------------------------------------
  # Calendar Server (Rust backend)
  # ---------------------------------------------------------------------------
  calendar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktcs-calendar
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - calendar-data:/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend (React SPA served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # VITE_CALENDAR_URL is baked into the JS bundle at BUILD time and must
        # match how nginx is wired.
        #
        # This Docker stack uses the "/api" convention: the frontend calls
        # <origin>/api/... and deploy/nginx/frontend.conf proxies /api/ ->
        # http://calendar:3001/ (stripping the /api prefix). WebSocket
        # (/api/v1/stream) is upgraded by the same location block.
        #
        # NOTE: a frontend image built here does NOT work behind the bare-metal
        # deploy/nginx/ktcs.conf, which expects same-origin /v1 (no /api prefix).
        # For that deployment, build with VITE_CALENDAR_URL="" (same-origin).
        VITE_CALENDAR_URL: /api
    container_name: ktcs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      calendar:
        condition: service_healthy

volumes:
  calendar-data:
    driver: local
